<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template id="f5-calendar-template">
      <style>
/*@CSS*/
        #f5-cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
        #f5-src { position: absolute; left: 110px; top: 190px; width: 360px; height: 640px; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow-lg); opacity: .4; }
        #f5-src svg { display: block; width: 100%; height: 100%; }
        #f5-arrow { position: absolute; left: 510px; top: 500px; width: 560px; height: 40px; }
        #f5-cal { position: absolute; left: 40px; top: 40px; width: 1840px; height: 1000px; background: #fff; border-radius: 16px; box-shadow: var(--shadow-lg); transform-origin: 50% 50%; }
        #f5-cal .hd { position: absolute; left: 40px; top: 34px; font: 700 64px/1 "Sora", sans-serif; letter-spacing: -0.04em; color: var(--ink); }
        #f5-cal .seg { position: absolute; right: 40px; top: 44px; display: flex; gap: 8px; }
        #f5-cal .seg span { padding: 12px 22px; border-radius: 999px; font: 600 20px/1 "Inter", sans-serif; color: var(--ink); background: var(--bg); }
        #f5-cal .seg span.on { background: var(--ink); color: #fff; }
        .f5-wd { position: absolute; top: 132px; width: 251px; text-align: center; font: 600 16px/1 "Inter", sans-serif; letter-spacing: .1em; color: var(--muted); }
        .f5-row { position: absolute; left: 40px; width: 1757px; height: 158px; }
        .f5-cell { position: absolute; top: 0; width: 251px; height: 158px; border-top: 2px solid var(--line); border-left: 2px solid var(--line); }
        .f5-cell .d { position: absolute; left: 14px; top: 12px; font: 600 22px/1 "Inter", sans-serif; color: var(--ink); }
        .f5-cell.out .d { color: #C9C1BB; }
        .f5-it { position: absolute; left: 12px; right: 12px; top: 46px; border-radius: 10px; padding: 10px 12px; font: 600 17px/1.2 "Inter", sans-serif; color: var(--ink); }
        .f5-it small { display: block; margin-top: 6px; font: 600 13px/1 "Inter", sans-serif; color: var(--ink-2); }
        #f5-it22 { background: var(--blue); }
        #f5-st { display: inline-block; margin-top: 8px; padding: 5px 10px; border-radius: 999px; background: #fff; font: 700 13px/1 "Inter", sans-serif; color: var(--ink); }
        .f5-chip { position: absolute; left: 12px; right: 12px; top: 46px; height: 92px; border-radius: 10px; }
        .f5-chip i { position: absolute; left: 12px; height: 9px; border-radius: 5px; background: rgba(255,255,255,.9); display: block; }
        .f5-th { position: absolute; width: 150px; height: 266px; transform-origin: 50% 50%; box-shadow: var(--shadow); border-radius: 8px; }
        .f5-th .thumb { width: 100%; height: 100%; }
        .f5-strip { position: absolute; left: 0; top: 0; width: 1920px; height: 300px; z-index: 6; overflow: hidden; }
        .f5-lab { left: 80px; top: 52px; font-size: 200px; }
        #f5m { z-index: 7; }
        #f5-pick { left: 120px; top: 300px; font-size: 150px; line-height: 0.95; z-index: 6; }
        #f5-box { position: absolute; left: 650px; top: 150px; width: 620px; height: 780px; background: #fff; border-radius: 28px; box-shadow: 0 30px 80px rgba(51,36,28,.22); transform-origin: 0 0; z-index: 4; }
        #f5-box .hb { position: absolute; left: 50%; top: 14px; width: 56px; height: 6px; margin-left: -28px; border-radius: 3px; background: var(--line); }
        #f5-box .t { position: absolute; left: 40px; top: 44px; font: 700 42px/1 "Sora", sans-serif; letter-spacing: -0.04em; color: var(--ink); }
        #f5-box .x { position: absolute; right: 36px; top: 42px; width: 46px; height: 46px; border-radius: 50%; background: var(--bg); font: 600 22px/46px "Inter", sans-serif; text-align: center; color: var(--ink); }
        #f5-box .q { position: absolute; left: 40px; top: 100px; font: 500 19px/1 "Inter", sans-serif; color: var(--ink-2); }
        #f5-box .sg { position: absolute; left: 40px; right: 40px; top: 140px; height: 104px; border-radius: 12px; background: var(--green); padding: 20px 20px 0 76px; }
        #f5-box .sg b { position: absolute; left: 22px; top: 24px; width: 36px; height: 36px; border-radius: 50%; background: #fff; font: 800 20px/36px "Inter", sans-serif; text-align: center; color: var(--ink); }
        #f5-box .sg .h { font: 700 21px/1.2 "Inter", sans-serif; color: var(--ink); }
        #f5-box .sg .s { margin-top: 6px; font: 500 16px/1.3 "Inter", sans-serif; color: var(--ink-2); }
        #f5-box .lb { position: absolute; left: 40px; font: 600 15px/1 "Inter", sans-serif; letter-spacing: .08em; color: var(--ink-2); }
        #f5-box .fd { position: absolute; height: 66px; border-radius: 12px; border: 2px solid var(--line); display: flex; align-items: center; padding: 0 20px; font: 500 22px/1 "Inter", sans-serif; color: var(--ink); }
        #f5-box .fd i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #A9C98A; margin-right: 14px; }
        #f5-box .pl { position: absolute; top: 590px; display: flex; gap: 10px; left: 40px; }
        #f5-box .pl span { padding: 14px 24px; border-radius: 999px; background: var(--bg); font: 600 18px/1 "Inter", sans-serif; color: var(--ink-2); }
        #f5-box .pl span.on { background: var(--ink); color: #fff; }
        #f5-box .sv { position: absolute; left: 40px; right: 40px; top: 670px; height: 74px; border-radius: 14px; background: var(--ink); color: #fff; display: flex; align-items: center; justify-content: center; font: 700 24px/1 "Inter", sans-serif; }
        #f5-date span { display: inline-block; margin-right: .26em; }

      </style>
      <div id="root" data-composition-id="f5-calendar" data-width="1920" data-height="1080" data-duration="7.6">
        <div class="paper"></div>
        <div id="f5-shake" style="position:absolute;inset:0"><div id="f5-stage"></div></div>
      </div>
      <script>
        (() => {
/*@LIB*/
          LB.prefix("f5");
          LB.setShake("#f5-shake");
          const C = LB.C;
          // October 2026 month grid: Mon 28 Sep … Sun 1 Nov. Oct d → index d + 2.
          const cellXY = (d) => { const i = d + 2; return [80 + (i % 7) * 251, 210 + Math.floor(i / 7) * 158]; };
          const DAYS = []; for (let i = 0; i < 35; i++) DAYS.push(i < 3 ? [28 + i, true] : i - 2 > 31 ? [i - 33, true] : [i - 2, false]);
          const EXIST = { 7: ["Behind the roast", "Draft", C.lavender], 19: ["Grinder FAQ", "Idea", C.line] };
          const CHIPS = [[2, C.green], [6, C.peach], [9, C.lavender], [12, C.green], [14, C.peach], [16, C.lavender], [20, C.green], [26, C.peach], [28, C.lavender], [30, C.green]];
          let cal = `<div id="f5-cal"><div class="hd">October 2026</div><div class="seg"><span>Week</span><span class="on">Month</span><span>Year</span></div>`;
          cal += ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"].map((w, i) => `<div class="f5-wd" style="left:${40 + i * 251}px">${w}</div>`).join("");
          for (let r = 0; r < 5; r++) {
            cal += `<div class="f5-row" id="f5-r${r}" style="top:${170 + r * 158}px">`;
            for (let c = 0; c < 7; c++) {
              const [d, out] = DAYS[r * 7 + c];
              const ex = !out && EXIST[d] ? `<div class="f5-it" style="background:${EXIST[d][2]};opacity:.75">${EXIST[d][0]}<small>${EXIST[d][1]}</small></div>` : "";
              const mine = !out && d === 22 ? `<div class="f5-it" id="f5-it22">Bitter coffee hook<br><span id="f5-st">To film</span></div>` : "";
              cal += `<div class="f5-cell ${out ? "out" : ""}" style="left:${c * 251}px"><div class="d">${d}</div>${ex}${mine}</div>`;
            }
            cal += `</div>`;
          }
          cal += `</div>`;
          const chips = CHIPS.map(([d, col], i) => { const [x, y] = cellXY(d);
            return `<div class="f5-chip" id="f5-ch${i}" style="left:${x - 40 + 12}px;top:${y - 40 + 46}px;right:auto;width:227px;background:${col}"><i style="top:24px;width:150px"></i><i style="top:46px;width:96px"></i></div>`; }).join("");
          const PILE = [[760, 240, -14], [900, 200, 9], [1030, 260, -6], [820, 360, 18], [980, 380, -20], [1120, 320, 12], [700, 420, 7], [1060, 470, -11], [880, 500, 4], [1200, 420, -16]];
          const thumbs = PILE.map(([x, y], i) => `<div class="f5-th" id="f5-t${i}" style="left:${x}px;top:${y}px">${LB.thumb([1, 3, 5, 7, 9, 11, 2, 4, 6, 8][i])}</div>`).join("");
          document.getElementById("f5-stage").innerHTML =
            `<div id="f5-cam">
              <div id="f5-src">${LB.grindArt("f5s")}</div>
              <svg id="f5-arrow" viewBox="0 0 560 40"><path d="M10 20 H530" stroke="#C9BDB2" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round"/><path d="M516 8 L536 20 L516 32" fill="none" stroke="#C9BDB2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              ${cal.replace("</div>\n", "</div>")}
              <div id="f5-chips" style="position:absolute;left:40px;top:40px">${chips}</div>
              ${thumbs}
              ${LB.briefDoc("f5d")}
              <div id="f5-box"><div class="hb"></div><div class="t">Schedule brief</div><div class="x">×</div>
                <div class="q">“If your coffee tastes bitter at home…”</div>
                <div class="sg"><b>!</b><div class="h">We suggest Thu 22, 08:00</div><div class="s">October is light on Awareness. Change anything below.</div></div>
                <div class="lb" style="top:276px">DATE</div><div class="fd" id="f5-date" style="left:40px;right:40px;top:300px;justify-content:space-between"><span id="f5-dt">${"Thursday 22 October 2026".split(" ").map((w) => "<span>" + w + "</span>").join("")}</span><span style="font-size:20px;color:#8A8280">⌄</span></div>
                <div class="lb" style="top:398px">TIME</div><div class="fd" style="left:40px;width:262px;top:422px">08:00</div>
                <div class="lb" style="top:398px;left:318px">STAGE</div><div class="fd" style="left:318px;width:262px;top:422px;background:${C.green};border-color:${C.green}"><i></i>Awareness</div>
                <div class="lb" style="top:520px">STATUS</div><div class="pl"><span class="on">Planned</span><span>Filming</span><span>Posted</span></div>
                <div class="sv" id="f5-save">Save schedule</div></div>
            </div>
            <div class="kt" id="f5-pick"><div>${LB.chars("PICK")}</div><div>${LB.chars("A DAY.")}</div></div>
            <div class="f5-strip" id="f5-S2" style="background:${C.green}"><div class="kt f5-lab" id="f5-L2" style="font-size:180px;top:62px">${LB.chars("FINALLY A PLAN.")}</div></div>
            ${LB.mascot("f5m", "green", { x: 1540, y: 690, w: 440 })}`;

          const tl = gsap.timeline({ paused: true });
          const CAM = "#f5-cam";
          LB.camSet(tl, CAM, 960, 540, 1);
          LB.animGrind(tl, "f5s", 0, 1.0);
          const label = (n, tIn, tOut) => {
            tl.fromTo("#f5-S" + n, { xPercent: -101 }, { xPercent: 0, duration: 0.45, ease: "pro-out" }, tIn - 0.12);
            LB.riseChars(tl, "#f5-L" + n, tIn, 0.025, 0.55);
            if (tOut) tl.to("#f5-S" + n, { xPercent: 101, duration: 0.4, ease: "power3.in" }, tOut);
          };
          // ---------- Scene 13: Add to calendar → the brief clumps into a Schedule box → into Thursday 22 ----------
          LB.press(tl, "#f5d-btn", 0.1);
          tl.to("#f5-src, #f5-arrow", { opacity: 0, duration: 0.35 }, 0.2);
          // the brief gathers itself into the schedule box
          tl.to("#f5d-doc", { x: -560, y: 45, scale: 0.6, duration: 0.55, ease: "pro-inout", transformOrigin: "50% 50%" }, 0.22);
          tl.to("#f5d-doc", { opacity: 0, duration: 0.25 }, 0.42);
          tl.fromTo("#f5-box", { x: 700, y: 130, scale: 0.55, opacity: 0 }, { x: 0, y: 0, scale: 1, duration: 0.55, ease: "pro-inout" }, 0.22);
          tl.to("#f5-box", { opacity: 1, duration: 0.25 }, 0.38);
          LB.hide(tl, "#f5-dt > span");
          document.querySelectorAll("#f5-dt > span").forEach((el, i) => tl.fromTo(el, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.2, ease: "pro-out", immediateRender: false }, 0.62 + i * 0.07));
          LB.press(tl, "#f5-save", 0.95);
          LB.riseChars(tl, "#f5-pick", 0.12, 0.03, 0.55);
          LB.dropChars(tl, "#f5-pick", 1.3, 0.015, 0.3);
          // the month builds behind it
          LB.hide(tl, "#f5-cal", { scale: 0.85, opacity: 0, filter: "blur(3px)" });
          LB.hide(tl, ".f5-row, .f5-wd, #f5-cal .hd, #f5-cal .seg");
          tl.to("#f5-cal", { scale: 0.97, opacity: 0.55, duration: 0.42, ease: "pro-out" }, 0.75);
          tl.to("#f5-cal", { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "pro-out" }, 1.2);
          tl.fromTo("#f5-cal .hd, #f5-cal .seg", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "pro-out", immediateRender: false }, 0.8);
          tl.fromTo(".f5-wd", { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, 0.85);
          for (let r = 0; r < 5; r++) tl.fromTo(`#f5-r${r}`, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.4, ease: "pro-out", immediateRender: false }, 0.85 + r * 0.06);
          // the box flies into Thursday 22 and becomes the calendar item
          const [cx, cy] = cellXY(22);
          LB.hide(tl, "#f5-it22");
          LB.hide(tl, "#f5-st", { scale: 0 });
          tl.to("#f5-box", { x: cx + 12 - 650, y: cy + 46 - 150, scale: 227 / 620, duration: 0.65, ease: "pro-inout" }, 1.15);
          tl.to("#f5-box", { opacity: 0, duration: 0.15 }, 1.72);
          tl.to("#f5-it22", { opacity: 1, duration: 0.15 }, 1.68);
          tl.fromTo("#f5-it22", { scale: 1.12 }, { scale: 1, duration: 0.5, ease: "pro-pop", immediateRender: false }, 1.72);
          LB.cam(tl, CAM, cx + 125, cy + 79, 2.2, 1.2, 0.75, "pro-inout");
          tl.to("#f5-st", { scale: 1, duration: 0.35, ease: "pro-pop" }, 1.98);
          LB.cam(tl, CAM, cx + 125, cy + 79, 2.32, 1.95, 0.9, "pro-inout");

          // ---------- Scene 14: pull back, the saved pile tumbles in and snaps into the month ----------
          LB.cam(tl, CAM, 960, 560, 0.9, 2.85, 0.7, "pro-out");
          PILE.forEach(([, , rot], i) => {
            tl.fromTo(`#f5-t${i}`, { y: -1100 - i * 40, rotation: rot * 2.5 }, { y: 0, rotation: rot, duration: 0.7, ease: "pro-pop" }, 3.0 + i * 0.05);
          });
          LB.hide(tl, ".f5-chip", { opacity: 0, scale: 0.4 });
          CHIPS.forEach(([d], i) => {
            const [x, y] = cellXY(d), [px, py] = PILE[i], t = 4.45 + i * 0.13;
            tl.to(`#f5-t${i}`, { x: x - px + 50.5, y: y - py - 41, scaleX: 227 / 150, scaleY: 92 / 266, rotation: 0, duration: 0.45, ease: "pro-pop" }, t);
            tl.to(`#f5-t${i}`, { opacity: 0, duration: 0.12 }, t + 0.38);
            tl.to(`#f5-ch${i}`, { opacity: 1, scale: 1, duration: 0.3, ease: "pro-pop" }, t + 0.36);
          });
          LB.cam(tl, CAM, 960, 560, 0.95, 4.4, 2.2, "pro-inout");
          // green mascot bounces in, looks at the full calendar, happiest squash
          tl.fromTo("#f5m", { x: 600, y: 0, rotation: 20 }, { x: 0, rotation: 0, duration: 0.6, ease: "pro-out" }, 3.6);
          LB.hop(tl, "#f5m", 3.65, 80);
          LB.emote(tl, "f5m", "shocked", 3.7);
          LB.look(tl, "f5m", -60, -30, 3.9, 0.3);
          LB.emote(tl, "f5m", "happy", 4.6);
          LB.emote(tl, "f5m", "joy", 6.1, 0.2);
          LB.squash(tl, "#f5m", 6.15, 1.22, 0.78);
          LB.hop(tl, "#f5m", 6.75, 90);
          LB.bob(tl, "f5m", 4.3, 7.6, 7, 1.2);
          label(2, 6.12, null);
          window.__timelines["f5-calendar"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
