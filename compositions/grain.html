<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template id="grain-template">
      <style>
        #root { position: absolute; inset: 0; background: transparent; pointer-events: none; }
        #grain-n { position: absolute; inset: -40px; opacity: 0.035; mix-blend-mode: multiply;
          background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
          background-size: 256px 256px; }
      </style>
      <div id="root" data-composition-id="grain" data-width="1920" data-height="1080" data-duration="65">
        <div id="grain-n"></div>
      </div>
      <script>
        (() => {
          // Film grain: the noise tile jumps to a new, index-derived offset every frame (deterministic).
          const tl = gsap.timeline({ paused: true });
          const el = document.getElementById("grain-n");
          const p = { f: 0 };
          const apply = () => { const f = Math.floor(p.f); el.style.backgroundPosition = `${(f * 73) % 256}px ${(f * 151) % 256}px`; };
          apply();
          tl.to(p, { f: 65 * 30, duration: 65, ease: "none", onUpdate: apply }, 0);
          window.__timelines["grain"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
