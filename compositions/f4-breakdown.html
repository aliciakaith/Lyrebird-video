  const BROWS = {

            tl.fromTo(`#f4-rb${i}`, { scaleX: 0 }, { scaleX: 1, duration: 0.45, ease: "pro-pop" }, 6.2 + i * 0.25);
          });
          shot(970, 660, 1.2, 7.3, 0.6);
          ["C", "D"].forEach((k, i) => {
            fillPart(k, 7.45 + i * 0.2);
            tl.fromTo(`#f4-${k}`, { y: 40 }, { y: 0, duration: 0.5, ease: "pro-out", immediateRender: false }, 7.45 + i * 0.2);
            tl.fromTo(`#f4-${k} .f4-small`, { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, 7.65 + i * 0.2);
          });

          // ---------- Scene 10: WHO IT'S FOR — funnel slot reel locks on Awareness ----------
          shot(970, 877, 1.9, 8.1, 0.55, "pro-inout", 960, 660);
          label(3, 8.4, 10.35, ["#f4-B", "#f4-C", "#f4-D"]);
          fillPart("E", 8.35);
          tl.fromTo("#f4-E .pills", { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.35, ease: "pro-pop", immediateRender: false }, 8.45);
          const reel = [{ p: 0 }, { p: 0 }, { p: 0 }];
          const reelApply = () => { $("#f4-reelst").style.transform = `translateY(${-reel.reduce((a, s) => a + s.p, 0) * 40}px)`; };
          reelApply();
          reel.forEach((s, i) => tl.to(s, { p: 1, duration: i === 2 ? 0.5 : 0.3, ease: i === 2 ? "pro-pop" : "pro-pop", onUpdate: reelApply }, 8.8 + i * 0.28));
          LB.nudge(tl, "#f4-reel", 9.45, 4, 5);
          tl.fromTo("#f4-p1", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "pro-pop", immediateRender: false }, 9.75);
          tl.fromTo("#f4-p2", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "pro-pop", immediateRender: false }, 9.95);
          tl.fromTo("#f4-cta", { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: false }, 10.2);
          // pull back to everything, then the deliberate hold: only a slow push-in
          shot(745, 510, 1.25, 10.55, 0.8, "pro-out");
          shot(745, 510, 1.29, 11.4, 2.4, "pro-inout");

          // ---------- Scene 11: YOUR BRAND ----------
          shot(1620, 410, 1.5, 13.95, 0.7, "pro-inout", 1300, 560);
          tl.fromTo("#f4-brand", { x: 600, rotationY: -25, opacity: 0, transformPerspective: 2000 }, { x: 0, rotationY: 0, opacity: 1, duration: 0.7, ease: "pro-out" }, 14.05);
          label(4, 14.3, 19.2, ["#f4-A", "#f4-B", "#f4-C", "#f4-D", "#f4-E", "#f4-src"]);
          LB.hide(tl, ".f4-field .fw");
          [15.72, 16.5, 17.42, 18.66].forEach((t, i) => {
            document.getElementById("f4-f" + i).querySelectorAll(".fw").forEach((el, j) => tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.18, ease: "pro-out", immediateRender: false }, t + j * 0.07));
          });
          shot(1620, 450, 1.58, 16.3, 2.6, "pro-inout", 1300, 560);

          // ---------- Scene 12: the rebuild — camera follows each card ----------
          shot(970, 205, 1.6, 19.4, 0.6, "pro-inout", 960, 640);
          label(5, 20.15, 22.3);
          document.querySelectorAll("#f4-qo .w").forEach((el, i) => tl.to(el, { y: -70, opacity: 0, duration: 0.24, ease: "power2.in" }, 20.15 + i * 0.035));
          tl.set("#f4-qn", { opacity: 1 }, 20.2);
          document.querySelectorAll("#f4-qn .w").forEach((el, i) => tl.fromTo(el, { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.32, ease: "pro-pop", immediateRender: false }, 20.3 + i * 0.045));
          LB.hide(tl, "#f4-qn .w");
          tl.to("#f4-al", { opacity: 0, duration: 0.15 }, 20.15);
          // brand profile → peach chip → flies onto the top of the stack
          LB.hide(tl, "#f4-chip", { x: 1500, y: 386, opacity: 0, scale: 0.6 });
          tl.to("#f4-brand", { scale: 0.3, opacity: 0, duration: 0.45, ease: "power2.in" }, 21.3);
          tl.to("#f4-chip", { opacity: 1, scale: 1, duration: 0.3, ease: "pro-pop" }, 21.55);
          tl.to("#f4-chip", { y: 46, duration: 0.4, ease: "pro-out" }, 21.85);
          tl.to("#f4-chip", { x: 560, rotation: -4, duration: 0.7, ease: "pro-inout" }, 21.95);
          tl.to("#f4-chip", { rotation: 0, duration: 0.4, ease: "pro-pop" }, 22.66);
          // shot list flips
          shot(970, 490, 1.45, 22.95, 0.5);
          LB.OLD_BEATS.forEach((_, i) => {
            tl.to(`#f4-rd${i}, #f4-rt${i}`, { y: -30, duration: 0.32, ease: "pro-pop" }, 23.25 + i * 0.12);
            tl.to(`#f4-rb${i}`, { scaleX: LB.NEW_BEATS[i][2] / LB.OLD_BEATS[i][2], duration: 0.4, ease: "pro-pop" }, 23.3 + i * 0.12);
          });
          // script, then caption
          shot(970, 750, 1.45, 23.75, 0.5, "pro-inout", 960, 540);
          tl.to("#f4-do", { y: -40, opacity: 0, duration: 0.25, ease: "power2.in" }, 23.9);
          tl.fromTo("#f4-dn", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "pro-out", immediateRender: false }, 24.05);
          tl.to("#f4-co", { y: -40, opacity: 0, duration: 0.25, ease: "power2.in" }, 24.8);
          tl.to("#f4-cl", { opacity: 0, duration: 0.12 }, 24.8);
          tl.fromTo("#f4-cn", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "pro-out", immediateRender: false }, 24.95);

          // pull back, everything snaps together into one brief on the right third
          shot(960, 540, 1, 25.15, 0.55, "pro-inout");
          const TGT = { A: [1256, 124, 0.644], B: [1256, 258, 0.644], C: [1256, 534, 1.32], D: [1390, 380, 0.45], E: [1256, 652, 0.644] };
          LB.hide(tl, "#f4d-doc", { opacity: 0, scale: 0.94, transformOrigin: "50% 50%" });
          LB.hide(tl, "#f4d-doc .in > *");
          KEYS.forEach((k, i) => {
            const [x, y] = P[k], [tx, ty, s] = TGT[k];
            tl.to(`#f4-${k}`, { x: tx - x, y: ty - y, scale: s, transformOrigin: "0 0", duration: 0.5, ease: "pro-pop" }, 25.45 + i * 0.05);
            tl.to(`#f4-${k}`, { opacity: 0, duration: 0.25 }, 26.05 + i * 0.03);
          });
          tl.to("#f4-chip", { x: 1256, y: 90, duration: 0.5, ease: "pro-inout" }, 25.45);
          tl.to("#f4-chip", { opacity: 0, duration: 0.2 }, 26.0);
          tl.to("#f4d-doc", { opacity: 1, scale: 1, duration: 0.5, ease: "pro-pop" }, 25.5);
          tl.to("#f4d-doc .in > *", { opacity: 1, duration: 0.25 }, 25.95);
          LB.camShake(tl, "#f4-stage", 25.95, 3, 0.2);
          tl.to("#f4-src", { opacity: 0.4, duration: 0.6, ease: "pro-inout" }, 25.6);
          LB.hide(tl, "#f4-arrow");
          tl.fromTo("#f4-arrow", { opacity: 0, scaleX: 0.2, transformOrigin: "0 50%" }, { opacity: 1, scaleX: 1, duration: 0.5, ease: "pro-out", immediateRender: false }, 26.1);

          window.__timelines["f4-breakdown"] = tl;
        })();
      </script>
    </template>
