<!doctype html>
<html>

      <style>
@font-face { font-family: "Sora"; src: url("../assets/fonts/sora-var.woff2") format("woff2"); font-weight: 100 800; font-display: block; }
@font-face { font-family: "Inter"; src: url("../assets/fonts/inter-var.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
@font-face { font-family: "JetBrains Mono"; src: url("../assets/fonts/jbmono-500.woff2") format("woff2"); font-weight: 500; font-display: block; }

#root {
  --bg: #FBF7F4; --ink: #33241C; --ink-2: #54423A; --muted: #8A8280; --line: #EFEAE5; --card: #FFFFFF;
  --green: #DFEEC8; --lavender: #DCD4F5; --peach: #FBDCC4; --blue: #D6E5F4; --pink: #F7D9E3;
  --grad-a: #D3CBF2; --grad-b: #ECE7FA;
  --shadow: 0 1px 2px rgba(51,36,28,.06), 0 8px 24px rgba(51,36,28,.08);
  --shadow-lg: 0 2px 4px rgba(51,36,28,.06), 0 30px 80px rgba(51,36,28,.18);

}
#root * { box-sizing: border-box; }
.abs { position: absolute; }
.sora { font-family: "Sora", sans-serif; letter-spacing: -0.03em; }
.label { font-family: "Inter", sans-serif; font-size: 15px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

/* Light-canvas texture so the frame never reads as a blank slide */

/* Mascot */

/* Generic vertical video player (not TikTok's UI) */

.thumb .play::after { content: ""; border-left: 11px solid var(--ink); border-top: 7px solid transparent; border-bottom: 7px solid transparent; margin-left: 3px; transform: scale(var(--ps, 1)); }

.lb-scr { position: absolute; inset: 0; background: #fff; }
.lb-kick { position: absolute; left: 22px; top: 76px; font: 600 11px/1 "Inter", sans-serif; letter-spacing: .14em; color: var(--muted); }
.lb-av { position: absolute; right: 22px; top: 66px; width: 30px; height: 30px; border-radius: 50%; background: var(--line); }
.lb-h { position: absolute; left: 22px; top: 96px; font: 700 34px/36px "Sora", sans-serif; letter-spacing: -0.035em; color: var(--ink); }
.lb-h .tk { display: inline-block; height: 36px; overflow: hidden; vertical-align: top; }

.lb-meta { position: absolute; left: 22px; right: 22px; top: 180px; display: flex; justify-content: space-between; font: 500 12px/1 "Inter", sans-serif; color: var(--muted); }
.lb-search { position: absolute; left: 22px; right: 22px; top: 204px; height: 42px; border-radius: 10px; background: var(--bg); border: 1.5px solid var(--line);
  display: flex; align-items: center; gap: 10px; padding: 0 14px; font: 500 13px/1 "Inter", sans-serif; color: var(--muted); }

.lb-pills b { width: 8px; height: 8px; border-radius: 50%; display: block; }
.lb-card { position: absolute; left: 0; top: 0; width: 181px; height: 318px; border-radius: 12px; overflow: hidden; }
.lb-card .art { position: absolute; left: 0; top: 0; width: 181px; height: 168px; }
.lb-card .art svg { display: block; width: 100%; height: 100%; }
.lb-card .body { position: absolute; left: 12px; right: 12px; top: 178px; }

.lb-card .tags { margin-top: 8px; display: flex; gap: 5px; }

.lb-card .vw svg { width: 13px; height: 13px; }
.lb-card .pl { position: absolute; left: 50%; top: 66px; width: 38px; height: 38px; margin-left: -19px; border-radius: 50%; background: rgba(255,255,255,.92); }
.lb-card .pl::after { content: ""; position: absolute; left: 15px; top: 12px; border-left: 11px solid var(--ink); border-top: 7px solid transparent; border-bottom: 7px solid transparent; }
.lb-nav { position: absolute; left: 18px; right: 18px; bottom: 26px; height: 64px; border-radius: 32px; background: var(--ink); display: flex; align-items: center; justify-content: space-around; padding: 0 12px; z-index: 30; }
.lb-nav span { display: flex; flex-direction: column; align-items: center; gap: 5px; font: 600 10px/1 "Inter", sans-serif; color: rgba(255,255,255,.62); width: 56px; }
.lb-nav span.on { color: #fff; }
.lb-nav span i { width: 18px; height: 18px; border-radius: 5px; border: 2px solid currentColor; display: block; }
.lb-plus { position: absolute; left: 50%; bottom: 52px; width: 64px; height: 64px; margin-left: -32px; border-radius: 50%; background: var(--peach); border: 5px solid var(--ink);
  display: flex; align-items: center; justify-content: center; font: 400 36px/1 "Inter", sans-serif; color: var(--ink); z-index: 31; }

/* Brief document (stage coords: 1220,60 · 600×870) */
.bd { position: absolute; left: 1220px; top: 60px; width: 600px; height: 870px; background: #fff; border-radius: 12px; box-shadow: var(--shadow-lg); }
.bd .in { position: absolute; left: 36px; right: 36px; top: 0; bottom: 0; }
.bd .ttl { position: absolute; left: 0; top: 36px; font: 700 30px/1.1 "Sora", sans-serif; letter-spacing: -0.03em; color: var(--ink); }
.bd .rdy { position: absolute; right: 0; top: 38px; padding: 8px 14px; border-radius: 999px; background: var(--blue); font: 700 15px/1 "Inter", sans-serif; color: var(--ink); }
.bd .from { position: absolute; left: 0; top: 80px; font: 500 15px/1 "Inter", sans-serif; color: var(--muted); }
.bd .lbl { position: absolute; left: 0; font: 600 14px/1 "Inter", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.bd .hook { position: absolute; left: 0; right: 0; top: 150px; font: 700 29px/1.22 "Sora", sans-serif; letter-spacing: -0.03em; color: var(--ink); }
.bd .row { position: absolute; left: 0; right: 0; display: flex; gap: 14px; align-items: baseline; font: 500 19px/1.25 "Inter", sans-serif; color: var(--ink); }
.bd .row .n { width: 28px; font: 700 15px/1 "JetBrains Mono", monospace; color: var(--muted); }
.bd .row .tm { width: 76px; font: 500 16px/1 "JetBrains Mono", monospace; color: var(--ink-2); flex: none; }
.bd .capt { position: absolute; left: 0; right: 0; top: 560px; font: 500 19px/1.35 "Inter", sans-serif; color: var(--ink); }
.bd .foot { position: absolute; left: 0; right: 0; top: 664px; display: flex; gap: 10px; align-items: center; }
.bd .btn { position: absolute; left: 0; right: 0; top: 764px; height: 70px; border-radius: 12px; background: var(--ink); color: #fff; display: flex; align-items: center; justify-content: center; font: 700 21px/1 "Inter", sans-serif; }

/* Kinetic type */
.kt { isolation: isolate; position: absolute; font-family: "Sora", sans-serif; font-weight: 700; letter-spacing: -0.045em; color: var(--ink); white-space: nowrap; line-height: 1; }
.kt-m { display: inline-block; overflow: hidden; vertical-align: top; padding: 0.04em 0 0.1em; margin: -0.04em 0 -0.1em; }
.kt-c { display: inline-block; will-change: transform; }
.kt-sp { display: inline-block; width: 0.26em; }
.kt-hl { position: absolute; z-index: -1; border-radius: 14px; transform-origin: 0 50%; }
.kt-roll { position: relative; overflow: hidden; }
.kt-roll > div { display: flex; flex-direction: column; }
/* Big player variant */
.player.big .handle { font-size: 30px; } .player.big .cap { font-size: 27px; margin-top: 8px; }
.player.big .views { font-size: 30px; gap: 10px; margin-top: 14px; }
.player.big .views svg { width: 30px; height: 30px; }
.player.big .views .tick { height: 36px; } .player.big .views .tick span { height: 36px; line-height: 36px; }
.player.big .rail { right: 22px; bottom: 210px; gap: 26px; } .player.big .rail i { width: 66px; height: 66px; }
.player.big .meta { left: 30px; right: 120px; bottom: 54px; }
.player .prog { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: rgba(255,255,255,.35); z-index: 3; }
.player .prog b { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; background: #fff; transform-origin: 0 50%; display: block; }

.tap { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%; background: rgba(51,36,28,.28); pointer-events: none; z-index: 80; }

        #root { background: transparent; }
        #f2-ink { position: absolute; inset: -6px; background: var(--ink); overflow: hidden; }
        #f2-cam { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
        #f2-word { left: 475px; top: 400px; font-size: 260px; color: var(--bg); }
        #f2-hole { position: absolute; left: 1079px; top: 538px; width: 200px; height: 200px; margin: -100px 0 0 -100px; border-radius: 50%; background: var(--bg); }
      </style>
      <div id="root" data-composition-id="f2-intro" data-width="1920" data-height="1080" data-duration="2.5">
        <div id="f2-ink"><div id="f2-cam"><div class="kt" id="f2-word"></div><div id="f2-mascots"></div><div id="f2-hole"></div></div></div>
      </div>
      <script>
        (() => {
// Lyrebird shared motion library — inlined into every frame by src/build.mjs.
// Pure functions of their inputs: no clocks, no Math.random. Everything is added to the caller's paused timeline.
const LB = (() => {
  // Easing system: pro-out (entrances/moves), pro-inout (camera), pro-pop (snaps, slams, landings).
  if (!window.__proEases) {
    window.__proEases = true;
    if (window.CustomEase) {
      gsap.registerPlugin(CustomEase);
      CustomEase.create("pro-out", "M0,0 C0.16,1 0.3,1 1,1");
      CustomEase.create("pro-inout", "M0,0 C0.7,0 0.2,1 1,1");
    } else {
      gsap.registerEase("pro-out", gsap.parseEase("pro-out"));
      gsap.registerEase("pro-inout", gsap.parseEase("pro-inout"));
    }
    gsap.registerEase("pro-pop", gsap.parseEase("pro-pop"));
  }
  const C = {
    bg: "#FBF7F4", ink: "#33241C", ink2: "#54423A", muted: "#8A8280", line: "#EFEAE5", card: "#FFFFFF",
    green: "#DFEEC8", lavender: "#DCD4F5", peach: "#FBDCC4", blue: "#D6E5F4", pink: "#F7D9E3",
    kraft: "#E2C3A0", kraftDark: "#C9A27E",
  };

  // ---------- Mascots (720×700 viewBox) ----------
  const BODY = {
    blue: "M270 0 C520 0 720 80 720 200 C720 450 560 695 230 695 C100 695 0 620 0 500 C0 240 90 0 270 0Z",
    pink: "M470 0 C620 0 720 240 720 470 C720 620 640 695 520 695 C250 690 0 560 0 240 C0 90 260 0 470 0Z",
    lavender: "M210 0 C470 0 720 70 720 230 C720 520 640 695 500 695 C250 695 0 610 0 450 C0 190 70 0 210 0Z",
    green: "M520 0 C640 0 720 110 720 250 C720 500 560 695 330 695 C120 695 0 610 0 480 C0 210 230 0 520 0Z",
  };
  BODY.lavender2 = BODY.green;
  const FILL = { blue: "#D6E5F4", pink: "#F5D7E2", lavender: "#DBD3F4", green: "#DFEBC8" };
  const DEFAULT_FACE = {
    blue: { eyes: "closed", mouth: "smile" }, pink: { eyes: "open", mouth: "o" },
    lavender: { eyes: "open", mouth: "flat" }, green: { eyes: "open", mouth: "smile" },
    lavender2: { eyes: "open", mouth: "smile" },
  };
  const EYE_CX = [288, 432];
  function eyeAttrs(state, cx) {
    if (state === "closed") return { x: cx - 32, y: 304, width: 64, height: 10, rx: 5 };
    if (state === "tall") return { x: cx - 23, y: 262, width: 46, height: 90, rx: 23 };
    if (state === "squeeze") return { x: cx - 30, y: 300, width: 60, height: 12, rx: 6 };
    return { x: cx - 22, y: 276, width: 44, height: 66, rx: 22 };
  }
  const attrStr = (a) => Object.entries(a).map(([k, v]) => `${k}="${v}"`).join(" ");

  function mascotSVG(id, kind, face, full) {
    face = Object.assign({}, DEFAULT_FACE[kind], face || {});
    const fill = kind === "lavender2" ? `url(#${id}-grad)` : FILL[kind];
    const cheek = kind === "pink" ? "#F2C9B4" : "#E8CFC0";
    const defs = kind === "lavender2"
      ? `<defs><linearGradient id="${id}-grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D3CBF2"/><stop offset="1" stop-color="#ECE7FA"/></linearGradient></defs>` : "";
    const op = (m) => (face.mouth === m ? 1 : 0);
    const ink = `stroke="${C.ink}" stroke-linecap="round" fill="none"`;
    const happy = face.eyes === "happy";
    const eyeA = eyeAttrs(happy ? "closed" : face.eyes, EYE_CX[0]), eyeB = eyeAttrs(happy ? "closed" : face.eyes, EYE_CX[1]);
    const extras = full === false ? "" : `
      <path id="${id}-sweat" d="M600 120 C620 150 632 170 632 186 A32 32 0 0 1 568 186 C568 170 580 150 600 120Z" fill="#CFE3F5" stroke="${C.ink}" stroke-width="6" opacity="0"/>
      <g id="${id}-ex" opacity="0"><rect x="584" y="-120" width="34" height="96" rx="17" fill="${C.ink}"/><circle cx="601" cy="10" r="19" fill="${C.ink}"/></g>
      <g id="${id}-qm" opacity="0"><path d="M572 -70 C572 -112 640 -112 640 -72 C640 -44 606 -40 606 -14" ${ink} stroke-width="20"/><circle cx="606" cy="22" r="13" fill="${C.ink}"/></g>`;
    return `<svg viewBox="0 0 720 700">${defs}<path d="${BODY[kind]}" fill="${fill}"/>
      <g id="${id}-face">
        <rect id="${id}-cL" x="182" y="356" width="70" height="38" rx="19" fill="${cheek}" style="transform-origin:217px 375px"/>
        <rect id="${id}-cR" x="468" y="356" width="70" height="38" rx="19" fill="${cheek}" style="transform-origin:503px 375px"/>
        <rect id="${id}-eL" ${attrStr(eyeA)} fill="${C.ink}" opacity="${happy ? 0 : 1}"/>
        <rect id="${id}-eR" ${attrStr(eyeB)} fill="${C.ink}" opacity="${happy ? 0 : 1}"/>
        <path id="${id}-hL" d="M262 322 Q288 284 314 322" ${ink} stroke-width="11" opacity="${happy ? 1 : 0}"/>
        <path id="${id}-hR" d="M406 322 Q432 284 458 322" ${ink} stroke-width="11" opacity="${happy ? 1 : 0}"/>
        <path id="${id}-bL" d="${BROWS.none[0]}" ${ink} stroke-width="10" opacity="0"/>
        <path id="${id}-bR" d="${BROWS.none[1]}" ${ink} stroke-width="10" opacity="0"/>
        <path id="${id}-mS" d="M287 392 A72 72 0 0 0 431 392" ${ink} stroke-width="7" opacity="${op("smile")}"/>
        <circle id="${id}-mO" cx="360" cy="430" r="34" fill="${C.ink}" opacity="${op("o")}"/>
        <rect id="${id}-mF" x="302" y="416" width="116" height="10" rx="5" fill="${C.ink}" opacity="${op("flat")}"/>
        <path id="${id}-mR" d="M300 446 Q360 386 420 446" ${ink} stroke-width="8" opacity="${op("frown")}"/>
        <path id="${id}-mG" d="M282 388 H438 A78 78 0 0 1 282 388Z" fill="${C.ink}" opacity="${op("grin")}"/>
        <path id="${id}-mW" d="M296 428 q16 -16 32 0 q16 16 32 0 q16 -16 32 0 q16 16 32 0" ${ink} stroke-width="7" opacity="${op("wobble")}"/>
      </g>${extras}</svg>`;
  }
  const BROWS = {
    none: ["M252 236 L318 236", "M402 236 L468 236"],
    sad: ["M250 250 L316 226", "M404 226 L470 250"],
    worried: ["M252 244 L316 230", "M404 230 L468 244"],
    up: ["M254 214 L318 206", "M402 206 L466 214"],
    angry: ["M252 222 L318 246", "M402 246 L468 222"],
    quizzical: ["M254 232 L318 238", "M402 204 L466 192"],
  };
  const MOUTHS = { smile: "S", o: "O", flat: "F", frown: "R", grin: "G", wobble: "W" };

  // Outer div: position / hops / squash (origin bottom-centre). Inner .bob: idle float only.
  function mascot(id, kind, o) {
    const w = o.w, h = Math.round(o.w * 700 / 720);
    return `<div class="mascot" id="${id}" style="left:${o.x}px;top:${o.y}px;width:${w}px;height:${h}px;${o.z != null ? "z-index:" + o.z + ";" : ""}">
      <div class="bob" id="${id}-bob" style="width:100%;height:100%">${mascotSVG(id, kind, o.face)}</div></div>`;
  }

  // eyes: open | closed | tall | squeeze | sad | happy (^ ^ arcs)
  function eyes(tl, id, state, t, dur = 0.15) {
    const happy = state === "happy", r = happy ? "closed" : state;
    tl.to(`#${id}-eL`, { attr: eyeAttrs(r, EYE_CX[0]), opacity: happy ? 0 : 1, duration: dur, ease: "pro-out" }, t);
    tl.to(`#${id}-eR`, { attr: eyeAttrs(r, EYE_CX[1]), opacity: happy ? 0 : 1, duration: dur, ease: "pro-out" }, t);
    tl.to(`#${id}-hL, #${id}-hR`, { opacity: happy ? 1 : 0, duration: dur * 0.8, ease: "none" }, t);
  }
  function mouth(tl, id, kind, t, dur = 0.15) {
    Object.values(MOUTHS).forEach((k) => tl.to(`#${id}-m${k}`, { opacity: MOUTHS[kind] === k ? 1 : 0, duration: dur, ease: "none" }, t));
  }
  function brows(tl, id, kind, t, dur = 0.15) {
    const [l, r] = BROWS[kind] || BROWS.none;
    tl.to(`#${id}-bL`, { attr: { d: l }, opacity: kind === "none" ? 0 : 1, duration: dur, ease: "pro-out" }, t);
    tl.to(`#${id}-bR`, { attr: { d: r }, opacity: kind === "none" ? 0 : 1, duration: dur, ease: "pro-out" }, t);
  }
  function sweat(tl, id, on, t) {
    if (on) tl.fromTo(`#${id}-sweat`, { opacity: 0, y: -20 }, { opacity: 1, y: 0, duration: 0.25, ease: "pro-pop", immediateRender: false }, t);
